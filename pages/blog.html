<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blog — Sprouty</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div id="login-modal-mount"></div>
<div id="hdr"></div>
<section class="section-sm">
  <div class="container">
    <h1>Blog Sprouty</h1>
    <p class="lead">Ý tưởng trồng cây, chăm sóc Bạn Cây và câu chuyện kỷ niệm từ cộng đồng Sprouty.</p>
    <div id="blog-list" class="grid-3" style="margin-top:24px"></div>
  </div>
</section>
<div id="ftr"></div>
<script src="../assets/js/env.js"></script>
<script src="../assets/js/api.js?v=20260710e"></script>
<script src="../assets/js/app.js?v=20260710e"></script>
<script>
document.getElementById('hdr').innerHTML = renderHeader('blog','../');
document.getElementById('ftr').innerHTML = renderFooter('../');
async function loadBlog(){
  const el = document.getElementById('blog-list');
  try {
    const { posts } = await API.blog.list({ limit: 24 });
    el.innerHTML = posts.length ? posts.map(p => `
      <article style="background:var(--surface);border:1px solid var(--parchment-2);border-radius:12px;overflow:hidden;box-shadow:var(--sh-sm)">
        ${p.coverUrl ? `<img src="${esc(p.coverUrl)}" alt="" style="width:100%;aspect-ratio:16/9;object-fit:cover">` : ''}
        <div style="padding:18px">
          <h3 style="font-size:1rem;margin-bottom:8px">${esc(p.title)}</h3>
          <p style="font-size:.86rem;color:var(--ink-3);line-height:1.6">${esc(p.excerpt || '')}</p>
          <a class="btn btn-outline btn-sm" href="blog-detail.html?slug=${encodeURIComponent(p.slug)}">Đọc bài</a>
        </div>
      </article>`).join('') : `<p style="color:var(--ink-4)">Chưa có bài viết nào.</p>`;
  } catch (e) {
    el.innerHTML = `<p style="color:var(--rose)">${esc(e.message || 'Không tải được blog.')}</p>`;
  }
}

loadBlog();

const blogEvents = new EventSource(`${window.ENV.API_BASE}/blog-events/stream`);
blogEvents.addEventListener('blog-updated', loadBlog);
</script>
</body>
</html>
