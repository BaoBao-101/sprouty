<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Giỏ hàng — Sprouty</title>
  <link rel="icon" href="../assets/images/favicon.svg?v=20260713b" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/style.css?v=20260712a">
  <style>
    .cart-layout { display:grid; grid-template-columns:1fr 340px; gap:28px; padding:36px 0 72px; align-items:start }
    .cart-item { display:flex; gap:16px; background:var(--surface); border:1.5px solid var(--parchment-2); border-radius:var(--r-xl); padding:18px; margin-bottom:12px; box-shadow:var(--sh-sm); transition:all .2s; align-items:flex-start }
    .cart-item:hover { box-shadow:var(--sh-md); border-color:var(--terra-3) }
    .cart-item-em { width:76px; height:76px; border-radius:var(--r-lg); display:flex; align-items:center; justify-content:center; font-size:2.5rem; flex-shrink:0 }
    .cart-item-info { flex:1; min-width:0 }
    .cart-item-name { font-family:var(--font-display); font-size:1rem; font-weight:600; color:var(--ink); margin-bottom:3px }
    .cart-item-meta { font-size:.76rem; color:var(--ink-4); font-family:var(--font-h) }
    .cart-qty-ctrl { display:flex; align-items:center; gap:10px; margin-top:10px }
    .cq-btn { width:30px; height:30px; border-radius:50%; background:var(--parchment); border:1.5px solid var(--parchment-2); font-weight:700; font-size:1.1rem; color:var(--ink-2); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .18s; user-select:none }
    .cq-btn:hover { background:var(--orange); color:#fff; border-color:var(--orange); transform:scale(1.1) }
    .cq-btn:active { transform:scale(.92) }
    .cq-val { font-family:var(--font-h); font-weight:700; font-size:.96rem; color:var(--ink); min-width:24px; text-align:center }
    .cart-item-price-col { display:flex; flex-direction:column; align-items:flex-end; justify-content:space-between; gap:8px; flex-shrink:0 }
    .cart-item-price { font-family:var(--font-h); font-size:.98rem; font-weight:800; color:var(--orange) }
    .cart-rm { width:28px; height:28px; border-radius:50%; background:none; border:1.5px solid var(--parchment-2); color:var(--ink-4); font-size:.78rem; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .18s }
    .cart-rm:hover { background:#FEE2E2; color:var(--rose); border-color:#FECACA }
    .order-summary { background:var(--surface); border:1.5px solid var(--parchment-2); border-radius:var(--r-2xl); padding:26px; position:sticky; top:108px; box-shadow:var(--sh-md) }
    .sum-row { display:flex; justify-content:space-between; align-items:center; font-size:.9rem; color:var(--ink-3); margin-bottom:10px }
    .sum-row strong { color:var(--ink-2); font-family:var(--font-h) }
    .sum-divider { height:1.5px; background:var(--parchment-2); margin:14px 0 }
    .sum-total { display:flex; justify-content:space-between; align-items:center; font-family:var(--font-h); font-weight:800 }
    .sum-total-lbl { font-size:1rem; color:var(--ink) }
    .sum-total-val { font-size:1.3rem; color:var(--orange) }
    .notice { display:flex; align-items:center; gap:10px; padding:11px 15px; border-radius:var(--r-lg); font-family:var(--font-h); font-size:.84rem; font-weight:600; margin-bottom:16px }
    .notice { background:#FEF3C7; color:#92400E; border:1px solid #FDE68A }
    .notice.green { background:#DCFCE7; color:#166534; border-color:#BBF7D0 }
    .promo-row { display:flex; gap:8px; margin:14px 0 4px }
    .promo-row input { flex:1; font-size:.86rem; border-radius:10px; padding:9px 12px; background:var(--cream); border:1.5px solid var(--parchment-2); outline:none; transition:border-color .2s; font-family:var(--font-body) }
    .promo-row input:focus { border-color:var(--orange); box-shadow:0 0 0 3px rgba(232,93,4,.1) }
    .promo-row button { font-family:var(--font-h); font-size:.84rem; font-weight:700; background:var(--parchment); border:1.5px solid var(--parchment-2); border-radius:10px; padding:9px 16px; cursor:pointer; transition:all .18s; color:var(--ink-2); white-space:nowrap }
    .promo-row button:hover { background:var(--orange); color:#fff; border-color:var(--orange) }
    @media(max-width:1024px) { .cart-layout { grid-template-columns:1fr } .order-summary { position:static } }
    @media(max-width:640px) { .cart-item-em { width:60px; height:60px; font-size:2rem } }
  </style>
</head>
<body>
<div id="login-modal-mount"></div>
<div id="hdr"></div>

<div style="background:linear-gradient(135deg,#1A1209 0%,#3D2B1F 55%,var(--terracotta) 100%);padding:48px 0 38px">
  <div class="container">
    <div class="breadcrumb" style="color:rgba(255,255,255,.45);margin-bottom:14px">
      <a href="../index.html" style="color:rgba(255,255,255,.45)">Trang chủ</a> › Giỏ hàng
    </div>
    <h1 style="color:#fff">Giỏ hàng</h1>
    <p style="color:rgba(255,255,255,.65);margin-top:6px;font-size:.95rem" id="cartCountHero">Đang tải...</p>
  </div>
</div>

<div class="container">
  <!-- Cart body -->
  <div id="cartBody"></div>
</div>

<div id="ftr"></div>
<script src="../assets/js/env.js"></script>
<script src="../assets/js/api.js?v=20260710m"></script>
<script src="../assets/js/app.js?v=20260711c"></script>
<script>
const ENV_EXTRA = { FREE_SHIP_MIN: 200000 };
document.getElementById('hdr').innerHTML = renderHeader('','../');
document.getElementById('ftr').innerHTML = renderFooter('../');

function renderCart() {
  const items = Cart.items;
  const heroLabel = document.getElementById('cartCountHero');
  if (heroLabel) heroLabel.textContent = items.length ? `${items.length} sản phẩm trong giỏ` : 'Giỏ hàng trống';

  const body = document.getElementById('cartBody');
  if (!items.length) {
    body.innerHTML = `
    <div style="text-align:center;padding:80px 20px">
      <img src="../assets/images/sprouty-icons/Cart.png" alt="Giỏ hàng trống" style="width:96px;height:96px;object-fit:contain;margin-bottom:18px;opacity:.5">
      <h2 style="margin-bottom:10px">Giỏ hàng đang trống</h2>
      <p style="color:var(--ink-3);margin-bottom:28px;font-size:.96rem">Bạn chưa thêm sản phẩm nào vào giỏ hàng.</p>
      <a href="shop.html" class="btn btn-primary btn-lg">Khám phá sản phẩm →</a>
    </div>`;
    return;
  }

  const total = Cart.total();
  // VIP is digital — activates on payment, nothing is ever shipped for it.
  // Shipping only applies when the cart has at least one physical item.
  const hasPhysicalItem = items.some(i => i.cat !== 'membership');
  const freeLeft = hasPhysicalItem ? Math.max(0, ENV_EXTRA.FREE_SHIP_MIN - total) : 0;
  const ship = hasPhysicalItem && total < ENV_EXTRA.FREE_SHIP_MIN ? 30000 : 0;
  const bgMap = { kit:'var(--terra-bg)', book:'var(--sage-bg)', membership:'var(--amber-bg)' };

  body.innerHTML = `
  <div class="cart-layout">
    <div>
      ${!hasPhysicalItem ? '' : freeLeft > 0
        ? `<div class="notice">🚚 Thêm <strong>${freeLeft.toLocaleString('vi-VN')}đ</strong> nữa để được miễn phí vận chuyển!</div>`
        : `<div class="notice green">🎉 Bạn đã được <strong>miễn phí vận chuyển</strong>!</div>`}

      <div id="itemsList">
        ${items.map(item => {
          // Use the snapshot stored on the cart item at add-time, so the cart keeps
          // showing the price/name the user added even if the catalog changes later.
          const price = Number(item.price) || 0;
          return `
          <div class="cart-item">
            <div class="cart-item-em" style="background:${bgMap[item.cat]||'var(--cream)'}">
              <img src="${esc(item.images && item.images[0] ? '..' + item.images[0] : '../assets/images/products/kit-' + item.id + '.svg')}" alt="${esc(item.name||'')}" style="width:72%;height:72%;object-fit:cover" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
              <span style="display:none;font-size:2.4rem">${esc(item.em||'📦')}</span>
            </div>
            <div class="cart-item-info">
              <div class="cart-item-name">${esc(item.name||'Sản phẩm')}${item.variant==='smart' ? ' <span class="tag tag-blue" style="font-size:.68rem;vertical-align:middle">Smart</span>' : ''}</div>
              <div class="cart-item-meta">${esc(item.col||'')} · ${esc(item.age||'')}</div>
              <div class="cart-qty-ctrl">
                <button class="cq-btn" onclick="Cart.setQty(${item.id},'${item.variant||'standard'}',${item.qty-1});renderCart()">−</button>
                <span class="cq-val">${item.qty}</span>
                <button class="cq-btn" onclick="Cart.setQty(${item.id},'${item.variant||'standard'}',${item.qty+1});renderCart()">+</button>
              </div>
            </div>
            <div class="cart-item-price-col">
              <div class="cart-item-price">${(price*item.qty).toLocaleString('vi-VN')}đ</div>
              <button class="cart-rm" onclick="Cart.remove(${item.id},'${item.variant||'standard'}');renderCart()" title="Xoá khỏi giỏ">✕</button>
            </div>
          </div>`;
        }).join('')}
      </div>

      <div style="display:flex;justify-content:flex-end;margin-top:8px">
        <button class="btn btn-ghost btn-sm" style="color:var(--rose)" onclick="if(confirm('Xoá tất cả sản phẩm khỏi giỏ hàng?')){Cart.clear();renderCart()}">🗑 Xoá giỏ hàng</button>
      </div>
    </div>

    <div>
      <div class="order-summary">
        <h3 style="font-family:var(--font-display);font-size:1.1rem;margin-bottom:18px;color:var(--ink)">Tóm tắt đơn hàng</h3>
        <div class="sum-row"><span>Tạm tính (${Cart.count()} sản phẩm)</span><strong>${total.toLocaleString('vi-VN')}đ</strong></div>
        ${hasPhysicalItem
          ? `<div class="sum-row"><span>Vận chuyển</span><strong style="color:${ship?'var(--ink-2)':'var(--green)'}">${ship ? ship.toLocaleString('vi-VN')+'đ' : 'Miễn phí 🎉'}</strong></div>`
          : `<div class="sum-row"><span>Vận chuyển</span><strong style="color:var(--ink-4)">Không áp dụng</strong></div>`}
        <div class="sum-divider"></div>
        <div class="sum-total">
          <span class="sum-total-lbl">Tổng cộng</span>
          <span class="sum-total-val">${(total+ship).toLocaleString('vi-VN')}đ</span>
        </div>
        <button class="btn btn-primary btn-block btn-lg" style="margin-top:20px;font-size:1rem" onclick="checkout()">Đặt hàng ngay →</button>
        <div style="text-align:center;margin-top:12px">
          <a href="shop.html" style="font-size:.82rem;color:var(--ink-4);text-decoration:none">← Tiếp tục mua sắm</a>
        </div>
        <div style="display:flex;justify-content:center;gap:16px;margin-top:18px;padding-top:16px;border-top:1px solid var(--parchment-2);flex-wrap:wrap">
          <span style="font-size:.72rem;color:var(--ink-5);display:flex;align-items:center;gap:4px">🔒 Thanh toán an toàn</span>
          <span style="font-size:.72rem;color:var(--ink-5);display:flex;align-items:center;gap:4px">🔄 Đổi trả 7 ngày</span>
          <span style="font-size:.72rem;color:var(--ink-5);display:flex;align-items:center;gap:4px">🚚 Giao toàn quốc</span>
        </div>
      </div>
    </div>
  </div>`;
}

function checkout() {
  if (!Auth.isLoggedIn()) {
    Toast.show('Vui lòng đăng nhập để đặt hàng', '');
    LoginModal.open();
    return;
  }
  // Show shipping info modal
  showShippingModal();
}

function showShippingModal() {
  // Rebuilt fresh every time (not cached) — whether the address field is
  // needed depends on the current cart contents, which can change between
  // opens in the same page session.
  document.getElementById('shipping-modal')?.remove();
  const needsAddress = Cart.items.some(i => i.cat !== 'membership');
  const modal = document.createElement('div');
  modal.id = 'shipping-modal';
  modal.className = 'modal-overlay open';
  modal.style.cssText = 'display:flex;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:20px';
  const user = Auth.user;
  modal.innerHTML = `
    <div style="background:var(--surface);border-radius:var(--r-xl);padding:28px;width:100%;max-width:440px;position:relative">
      <button onclick="this.closest('#shipping-modal').remove()" style="position:absolute;top:12px;right:14px;background:none;border:none;font-size:1.3rem;color:var(--ink-3);cursor:pointer">✕</button>
      <h2 style="margin-bottom:20px;font-size:1.2rem">${needsAddress ? 'Thông tin giao hàng' : 'Xác nhận thanh toán'}</h2>
      ${!needsAddress ? `<p style="font-size:.86rem;color:var(--ink-4);margin-bottom:16px">Gói VIP kích hoạt ngay sau khi thanh toán — không cần giao hàng.</p>` : ''}
      <div class="form-group">
        <label class="form-label">Họ tên *</label>
        <input class="form-input" type="text" id="ship-name" value="${user?.name||''}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Số điện thoại *</label>
        <input class="form-input" type="tel" id="ship-phone" placeholder="0901234567" required>
      </div>
      ${needsAddress ? `
      <div class="form-group">
        <label class="form-label">Địa chỉ giao hàng *</label>
        <textarea class="form-input" id="ship-addr" rows="3" placeholder="Số nhà, tên đường, phường/xã, quận/huyện, tỉnh/thành" required style="resize:vertical"></textarea>
      </div>` : ''}
      <div class="form-group">
        <label class="form-label">Ghi chú (tùy chọn)</label>
        <input class="form-input" type="text" id="ship-note" placeholder="${needsAddress ? 'Giao buổi chiều, gọi trước khi giao...' : 'Ghi chú thêm (nếu có)'}">
      </div>
      <div id="ship-err" style="display:none;color:var(--rose);font-size:.84rem;margin-bottom:12px"></div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn btn-ghost" onclick="this.closest('#shipping-modal').remove()">Hủy</button>
        <button class="btn btn-primary" id="ship-submit" style="flex:1" onclick="submitOrder()">${needsAddress ? 'Đặt hàng ngay →' : 'Thanh toán ngay →'}</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

async function submitOrder() {
  const needsAddress = Cart.items.some(i => i.cat !== 'membership');
  const name = document.getElementById('ship-name').value.trim();
  const phone = document.getElementById('ship-phone').value.trim();
  const addr = needsAddress ? document.getElementById('ship-addr').value.trim() : '';
  const note = document.getElementById('ship-note').value.trim();
  const errEl = document.getElementById('ship-err');
  const btn = document.getElementById('ship-submit');
  errEl.style.display = 'none';

  if (!name || !phone || (needsAddress && !addr)) { errEl.textContent='Vui lòng điền đầy đủ thông tin.'; errEl.style.display='block'; return; }
  if (!/^[0-9]{9,11}$/.test(phone)) { errEl.textContent='Số điện thoại không hợp lệ (9–11 chữ số).'; errEl.style.display='block'; return; }
  if (needsAddress && addr.length < 10) { errEl.textContent='Địa chỉ quá ngắn, vui lòng nhập đầy đủ.'; errEl.style.display='block'; return; }

  btn.disabled = true; btn.textContent = 'Đang xử lý...';
  try {
    const items = Cart.items.map(i => ({ productId: i.id, qty: i.qty, variant: i.variant === 'smart' ? 'smart' : 'standard' }));
    const { order } = await API.orders.create({ items, shippingName: name, shippingPhone: phone, shippingAddress: addr || undefined, note: note || undefined });
    document.getElementById('shipping-modal')?.remove();
    Cart.clear();
    // Redirect to the dedicated payment page — it handles QR display, polling,
    // and the post-payment success state in one canonical flow.
    window.location.href = 'payment.html?orderId=' + encodeURIComponent(order.id);
  } catch(e) {
    errEl.textContent = e.message || 'Đặt hàng thất bại. Thử lại sau.';
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = needsAddress ? 'Đặt hàng ngay →' : 'Thanh toán ngay →';
  }
}

renderCart();
</script>
</body>
</html>
