<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nhập mã kích hoạt — Sprouty</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div id="login-modal-mount"></div>
<div id="hdr"></div>
<section class="section-sm">
  <div class="container" style="max-width:640px">
    <h1>Nhập mã kích hoạt</h1>
    <p class="lead">Kích hoạt trợ lý AI, video hướng dẫn hoặc thư viện ảnh cho kit của bạn.</p>
    <div style="background:var(--surface);border:1px solid var(--parchment-2);border-radius:12px;padding:22px;box-shadow:var(--sh-sm)">
      <form onsubmit="redeemCode(event)">
        <label class="form-label">Mã kích hoạt</label>
        <input class="form-input" id="redeem-code" autocomplete="one-time-code" required maxlength="128" placeholder="SPR-XXXX-XXXX">
        <button class="btn btn-primary" id="redeem-btn" style="margin-top:12px">Kích hoạt</button>
      </form>
      <div id="redeem-result" style="margin-top:16px"></div>
    </div>
  </div>
</section>
<div id="ftr"></div>
<script src="../assets/js/env.js"></script>
<script src="../assets/js/api.js?v=20260710k"></script>
<script src="../assets/js/app.js?v=20260710k"></script>
<script>
document.getElementById('hdr').innerHTML = renderHeader('account','../');
document.getElementById('ftr').innerHTML = renderFooter('../');

function onAuthChange() {
  if (!Auth.isLoggedIn()) LoginModal.open();
}

async function redeemCode(e) {
  e.preventDefault();
  if (!Auth.isLoggedIn()) { LoginModal.open(); return; }
  const btn = document.getElementById('redeem-btn');
  const out = document.getElementById('redeem-result');
  btn.disabled = true; btn.textContent = 'Đang kích hoạt...';
  try {
    const data = await API.redeem.apply(document.getElementById('redeem-code').value);
    const labels = { ai_assistant:'Trợ lý AI', instruction_videos:'Video hướng dẫn', image_uploads:'Upload ảnh' };
    out.innerHTML = `<div style="color:var(--green);font-weight:700;margin-bottom:8px">Đã kích hoạt mã.</div>
      <div>${data.features.map(f => `<span class="tag tag-green" style="margin-right:6px">${labels[f] || f}</span>`).join('')}</div>
      ${data.productId ? `<p style="font-size:.84rem;color:var(--ink-4);margin-top:10px">Áp dụng cho sản phẩm #${data.productId}</p>` : ''}`;
    Toast.show('Đã kích hoạt mã', 'success');
  } catch (err) {
    out.innerHTML = `<div style="color:var(--rose)">${esc(err.message || 'Không thể kích hoạt mã.')}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = 'Kích hoạt';
  }
}
</script>
</body>
</html>
