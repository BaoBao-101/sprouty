<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cây Kỷ Niệm — Sprouty</title>
  <link rel="icon" href="../assets/images/favicon.svg?v=20260713b" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/style.css?v=20260714c">
  <style>
    .tree-hero { background:linear-gradient(135deg,#1A1209 0%,#3D2B1F 55%,var(--terracotta) 100%); padding:36px 0 28px; color:#fff }
    .tree-hero h1 { color:#fff; margin:0 }
    .tree-hero p { color:rgba(255,255,255,.75); margin-top:6px; font-size:.92rem }
    .tree-breadcrumb { color:rgba(255,255,255,.45); margin-bottom:10px; font-size:.84rem }
    .tree-breadcrumb a { color:rgba(255,255,255,.45) }

    .tree-stage {
      position:relative;
      width:100%;
      max-width:560px;
      margin:0 auto;
      aspect-ratio:1/1;
      background:radial-gradient(ellipse at 50% 100%, #FEF9EF 0%, var(--surface) 70%);
      border:1.5px solid var(--parchment-2);
      border-radius:var(--r-2xl);
      box-shadow:var(--sh-md);
      overflow:hidden;
    }
    .tree-bg-img {
      position:absolute; inset:0; width:100%; height:100%;
      object-fit:contain; object-position:center bottom;
      pointer-events:none; user-select:none;
    }
    /* Leaf slots are masked to that exact leaf's own silhouette, cropped
       straight out of tree-leaves-frame.png (assets/images/tree/leaves/) —
       so each slot's shape, size and rotation matches the reference frame
       pixel-for-pixel instead of one generic template leaf reused everywhere. */
    .leaf-slot {
      position:absolute;
      display:flex; align-items:center; justify-content:center;
      transition:transform .2s var(--ease,ease), box-shadow .2s;
      cursor:default;
      -webkit-mask-size:100% 100%; mask-size:100% 100%;
      -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
      -webkit-mask-position:center; mask-position:center;
    }
    .leaf-slot.filled { cursor:pointer; box-shadow:var(--sh-sm); background:var(--parchment) }
    .leaf-slot.filled img, .leaf-slot.filled video { width:100%; height:100%; object-fit:cover }
    .leaf-slot.filled:hover { transform:scale(1.15); z-index:5 }
    .leaf-play-badge {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:1.1rem; text-shadow:0 1px 4px rgba(0,0,0,.5);
      background:rgba(0,0,0,.15); pointer-events:none;
    }
    .leaf-slot.next {
      cursor:pointer;
      background:var(--green);
      opacity:.5;
      animation:leafPulse 2.2s ease-in-out infinite;
    }
    .leaf-slot.next:hover { transform:scale(1.12); opacity:.75 }
    .leaf-slot.next img { width:46%; height:46%; object-fit:contain }
    @keyframes leafPulse { 0%,100%{ opacity:.5 } 50%{ opacity:.85 } }

    .tree-full-msg {
      position:absolute; left:50%; top:8%; transform:translateX(-50%);
      background:rgba(255,255,255,.92); border:1px solid var(--parchment-2);
      border-radius:var(--r-full); padding:8px 16px; font-size:.8rem;
      font-family:var(--font-h); font-weight:700; color:var(--ink-2);
      box-shadow:var(--sh-sm); white-space:nowrap;
    }
    .leaf-count-badge {
      display:inline-flex; align-items:center; gap:6px;
      background:var(--parchment); border-radius:var(--r-full);
      padding:6px 14px; font-family:var(--font-h); font-size:.82rem; font-weight:700; color:var(--ink-2);
    }

    /* Leaf lightbox */
    .leaf-modal-card {
      background:var(--surface); border-radius:16px; padding:18px;
      width:min(560px,100%); max-height:90vh; overflow-y:auto; position:relative;
    }
    .leaf-media-frame {
      background:var(--parchment); border:6px solid var(--surface);
      outline:2px solid var(--primary-300); border-radius:14px;
      padding:8px; margin-bottom:14px; box-shadow:var(--sh-sm);
    }
    .leaf-media-frame img, .leaf-media-frame video {
      display:block; width:100%; max-height:56vh; object-fit:contain; border-radius:8px;
    }
    .leaf-remove-limit { font-size:.76rem; color:var(--ink-4); margin-top:6px }
  </style>
</head>
<body>
<div id="login-modal-mount"></div>
<div id="hdr"></div>

<div id="lockedView" style="display:none">
  <div class="locked-screen-wrap">
    <div class="locked-card">
      <div style="font-size:4rem;margin-bottom:20px">🔐</div>
      <h2 style="margin-bottom:10px">Đăng nhập để xem Cây Kỷ Niệm</h2>
      <button class="btn btn-primary btn-lg btn-block" onclick="LoginModal.open()">Đăng nhập ngay →</button>
    </div>
  </div>
</div>

<div id="mainView" style="display:none">
  <div class="tree-hero">
    <div class="container">
      <div class="tree-breadcrumb">
        <a href="../index.html">Trang chủ</a> › <a href="my-products.html">Cây của tôi</a> › <span id="treeCrumb">Cây Kỷ Niệm</span>
      </div>
      <h1 id="treeTitle">Cây Kỷ Niệm</h1>
      <p>Mỗi tấm ảnh hoặc video bé chăm cây sẽ nở thành một chiếc lá trên cây. Bấm vào lá xanh nhạt để thêm khoảnh khắc mới.</p>
    </div>
  </div>

  <section style="padding:32px 0 72px">
    <div class="container">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px">
        <span class="leaf-count-badge">🍃 <span id="leafCount">0</span>/<span id="leafMax">10</span> lá</span>
        <div style="display:flex;gap:8px">
          <a class="btn btn-outline btn-sm" id="videoLink" href="#">🎬 Video hướng dẫn</a>
          <a class="btn btn-ghost btn-sm" href="my-products.html">← Quay lại</a>
        </div>
      </div>

      <div class="tree-stage" id="treeStage"></div>

      <input type="file" id="leafFileInput" accept="image/*,video/*" style="display:none">
    </div>
  </section>
</div>

<!-- Lightbox for a filled leaf -->
<div class="modal-overlay" id="leafModal">
  <div class="leaf-modal-card">
    <button onclick="closeLeafModal()" style="position:absolute;right:12px;top:8px;background:none;border:0;font-size:1.5rem;cursor:pointer;z-index:1">✕</button>
    <div id="leafModalBody"></div>
  </div>
</div>

<div id="ftr"></div>
<script src="../assets/js/env.js"></script>
<script src="../assets/js/api.js?v=20260710m"></script>
<script src="../assets/js/app.js?v=20260714a"></script>
<script>
document.getElementById('hdr').innerHTML = renderHeader('myproducts','../');
document.getElementById('ftr').innerHTML = renderFooter('../');

// Real cap comes from the API (10 standard / 25 VIP — see
// backend/src/routes/user-images.js), this is just the initial render guess.
let MAX_LEAVES = 10;
const pid = +new URLSearchParams(location.search).get('id');
let product = null;
let images = [];
let removalsUsed = 0;
let removalsMax = 5;

// Each leaf's own bounding box [left%, top%, width%, height%] + its
// individually-cropped shape file (assets/images/tree/leaves/leaf-NN.png),
// cut straight out of tree-leaves-frame.png so every slot's silhouette and
// rotation match the reference frame exactly (not a shared/rotated
// template). Sorted inside-out by distance from the trunk base, which is
// why leaves grow from the trunk outward and the fully-grown tree matches
// tree-full.png's canopy. See extract_leaf_shapes.py.
const LEAF_POSITIONS = [
  { file:"leaf-01.png", left:24.19, top:65.95, width:15.17, height:12.48 },
  { file:"leaf-02.png", left:55.97, top:61.31, width:16.13, height:11.36 },
  { file:"leaf-03.png", left:11.94, top:66.85, width:12.54, height:6.14 },
  { file:"leaf-04.png", left:65.54, top:58.85, width:15.46, height:6.85 },
  { file:"leaf-05.png", left:14.88, top:59.14, width:15.55, height:6.78 },
  { file:"leaf-06.png", left:22.30, top:52.13, width:18.56, height:8.96 },
  { file:"leaf-07.png", left:56.99, top:50.08, width:17.76, height:9.57 },
  { file:"leaf-08.png", left:75.68, top:51.68, width:11.52, height:10.91 },
  { file:"leaf-09.png", left:36.22, top:35.87, width:11.33, height:16.10 },
  { file:"leaf-10.png", left:11.94, top:48.22, width:11.97, height:10.43 },
  { file:"leaf-11.png", left:84.74, top:52.93, width:11.01, height:7.68 },
  { file:"leaf-12.png", left:3.46, top:47.74, width:12.54, height:6.14 },
  { file:"leaf-13.png", left:67.87, top:38.59, width:19.33, height:8.29 },
  { file:"leaf-14.png", left:80.16, top:45.25, width:15.62, height:6.72 },
  { file:"leaf-15.png", left:54.85, top:26.14, width:9.34, height:18.11 },
  { file:"leaf-16.png", left:16.16, top:32.74, width:15.55, height:11.97 },
  { file:"leaf-17.png", left:5.79, top:39.84, width:15.55, height:6.78 },
  { file:"leaf-18.png", left:34.34, top:26.98, width:11.42, height:7.30 },
  { file:"leaf-19.png", left:26.56, top:22.66, width:6.98, height:15.20 },
  { file:"leaf-20.png", left:80.93, top:30.11, width:15.55, height:6.78 },
  { file:"leaf-21.png", left:72.86, top:20.22, width:13.73, height:14.05 },
  { file:"leaf-22.png", left:30.14, top:15.07, width:13.18, height:8.99 },
  { file:"leaf-23.png", left:50.82, top:8.38, width:9.47, height:17.95 },
  { file:"leaf-24.png", left:60.32, top:13.44, width:8.70, height:10.18 },
  { file:"leaf-25.png", left:70.75, top:11.07, width:6.94, height:15.36 },
  { file:"leaf-26.png", left:43.39, top:3.10, width:7.30, height:14.85 },
  { file:"leaf-27.png", left:22.82, top:8.70, width:13.02, height:5.82 },
  { file:"leaf-28.png", left:32.83, top:1.54, width:10.05, height:12.29 },
];

function onAuthChange() {
  if (!Auth.isLoggedIn()) {
    document.getElementById('lockedView').style.display = 'block';
    document.getElementById('mainView').style.display = 'none';
    return;
  }
  document.getElementById('lockedView').style.display = 'none';
  document.getElementById('mainView').style.display = 'block';
  init();
}

async function init() {
  if (!pid) { location.href = 'my-products.html'; return; }
  try {
    const { product: p } = await API.products.get(pid);
    product = p;
    document.getElementById('treeTitle').textContent = `Cây Kỷ Niệm — ${p.name}`;
    document.getElementById('treeCrumb').textContent = p.name;
    document.getElementById('videoLink').href = `product-detail.html?id=${pid}&tab=videos`;
  } catch {
    document.getElementById('treeTitle').textContent = 'Cây Kỷ Niệm';
  }
  await loadLeaves();
}

function isVideoLeaf(img) {
  return (img.asset?.mimeType || '').startsWith('video/');
}

async function loadLeaves() {
  try {
    const { images: imgs, maxLeaves, removalsUsed: used, removalsMax: max } = await API.myImages.list(pid);
    images = imgs;
    if (maxLeaves) MAX_LEAVES = Math.min(maxLeaves, LEAF_POSITIONS.length);
    if (typeof used === 'number') removalsUsed = used;
    if (typeof max === 'number') removalsMax = max;
    document.getElementById('leafMax').textContent = MAX_LEAVES;
  } catch (e) {
    Toast.show(e.message || 'Không tải được cây kỷ niệm', 'error');
    images = [];
  }
  renderTree();
}

function renderTree() {
  document.getElementById('leafCount').textContent = images.length;
  const stage = document.getElementById('treeStage');
  const full = images.length >= MAX_LEAVES;

  // A single unified tree (bare trunk) for every product — leaves upload
  // photos grow onto it one at a time. Per-plant art still appears
  // everywhere else (product cards, "Cây của tôi" list, cart, etc.).
  let html = `<img class="tree-bg-img" src="../assets/images/tree/tree-trunk.png" alt="${esc(product?.name || 'Cây Kỷ Niệm')}">`;
  if (full) {
    html += `<div class="tree-full-msg"><img src="../assets/images/sprouty-icons/MyTree.png" alt="" style="width:18px;height:18px;object-fit:contain;vertical-align:middle;margin-right:4px">Cây đã đủ ${MAX_LEAVES} lá kỷ niệm rồi!</div>`;
  }

  for (let i = 0; i < MAX_LEAVES; i += 1) {
    const pos = LEAF_POSITIONS[i];
    const maskUrl = `../assets/images/tree/leaves/${pos.file}`;
    const style = `left:${pos.left}%;top:${pos.top}%;width:${pos.width}%;height:${pos.height}%;`
      + `-webkit-mask-image:url(${maskUrl});mask-image:url(${maskUrl})`;
    if (i < images.length) {
      const img = images[i];
      const isVideo = isVideoLeaf(img);
      html += `<div class="leaf-slot filled" style="${style}" onclick="openLeaf('${img.id}')" title="${esc(img.title || 'Kỷ niệm')}">
        ${isVideo
          ? `<video src="${esc(img.url)}" muted></video><span class="leaf-play-badge">▶</span>`
          : `<img src="${esc(img.url)}" alt="">`}
      </div>`;
    } else if (i === images.length && !full) {
      html += `<div class="leaf-slot next" style="${style}" onclick="addLeaf()" title="Thêm khoảnh khắc mới"><img src="../assets/images/sprouty-icons/AddPhoto.png" alt="Thêm ảnh"></div>`;
      break; // only the next slot is clickable — leaves grow one at a time
    } else {
      break; // future slots stay hidden until earlier ones are filled
    }
  }
  stage.innerHTML = html;
}

function addLeaf() {
  document.getElementById('leafFileInput').click();
}

document.getElementById('leafFileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const form = new FormData();
  form.append('image', file);
  try {
    await API.myImages.upload(pid, form);
    Toast.show('🍃 Một chiếc lá mới đã nở!', 'success');
    await loadLeaves();
    showNewLeafFeedback(file);
  } catch (err) {
    Toast.show(err.message || 'Không thể thêm lá mới', 'error');
  }
});

function showNewLeafFeedback(file) {
  const url = URL.createObjectURL(file);
  const isVideo = file.type.startsWith('video/');
  const body = document.getElementById('leafModalBody');
  body.innerHTML = `
    <div class="leaf-media-frame">
      ${isVideo ? `<video src="${url}" controls></video>` : `<img src="${url}">`}
    </div>
    <div style="display:flex;gap:8px;align-items:flex-start;padding:12px;background:var(--cream-2);border-radius:10px">
      <div class="spinner"></div><span style="color:var(--ink-4)">Plant Buddy đang đọc kỷ niệm...</span>
    </div>`;
  openLeafModal();
  callAIFeedback();
}

async function callAIFeedback() {
  const box = document.querySelector('#leafModalBody > div:last-child');
  try {
    const { reply } = await API.chat.send(
      [{ role: 'user', content: `Bé đã chăm sóc Sprouty Kit "${product?.name || 'kit'}" và vừa tải ảnh/video kỷ niệm lên. Hãy khen ngợi sự kiên nhẫn chăm cây của bé, gợi ý 1-2 bước chăm sóc tiếp theo, rồi khuyến khích gia đình tiếp tục lưu nhật ký.` }],
      'Bạn là Plant Buddy thân thiện của Sprouty Vietnam. Trả lời bằng tiếng Việt, giọng văn ấm áp, khích lệ như đang nói chuyện với phụ huynh và bé, khoảng 4-6 câu.'
    );
    if (box) box.innerHTML = `<span style="font-size:1.2rem;flex-shrink:0">🤖</span><div>${esc(reply).replace(/\n/g, '<br>')}</div>`;
  } catch {
    if (box) box.innerHTML = `<span style="font-size:1.2rem;flex-shrink:0">🎨</span><div>Tuyệt vời! Bé đã chăm cây rất kiên nhẫn. Hãy ghi lại hôm nay cây thay đổi điều gì, bé đã tưới nước ra sao và cảm xúc của cả nhà khi nhìn thấy mầm cây lớn lên nhé!</div>`;
  }
}

function openLeaf(imageId) {
  const img = images.find(i => i.id === imageId);
  if (!img) return;
  const body = document.getElementById('leafModalBody');
  const isVideo = isVideoLeaf(img);
  const removalsLeft = Math.max(0, removalsMax - removalsUsed);
  body.innerHTML = `
    <div class="leaf-media-frame">
      ${isVideo
        ? `<video src="${esc(img.url)}" controls onerror="this.closest('.leaf-media-frame').innerHTML='<p style=&quot;padding:20px;text-align:center;color:var(--ink-4)&quot;>Không tải được video này.</p>'"></video>`
        : `<img src="${esc(img.url)}" alt="${esc(img.title || 'Kỷ niệm')}" onerror="this.closest('.leaf-media-frame').innerHTML='<p style=&quot;padding:20px;text-align:center;color:var(--ink-4)&quot;>Không tải được ảnh này.</p>'">`}
    </div>
    <input class="form-input" id="leafTitleInput" value="${esc(img.title || '')}" placeholder="Đặt tên cho khoảnh khắc này" style="margin-bottom:10px">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button class="btn btn-primary btn-sm" onclick="saveLeafTitle('${img.id}')">Lưu tên</button>
      <button class="btn btn-ghost btn-sm" style="color:var(--rose)" onclick="removeLeaf('${img.id}')" ${removalsLeft <= 0 ? 'disabled' : ''}>Xoá lá này</button>
    </div>
    <p class="leaf-remove-limit">Lượt gỡ &amp; đăng lại đã dùng: ${removalsUsed}/${removalsMax}${removalsLeft <= 0 ? ' — đã hết lượt gỡ cho cây này' : ''}</p>`;
  openLeafModal();
}

function openLeafModal() {
  document.getElementById('leafModal').classList.add('open');
}

function closeLeafModal() {
  document.getElementById('leafModal').classList.remove('open');
}

async function saveLeafTitle(imageId) {
  const title = document.getElementById('leafTitleInput').value;
  try {
    await API.myImages.update(imageId, { title });
    Toast.show('Đã lưu', 'success');
    closeLeafModal();
    await loadLeaves();
  } catch (e) { Toast.show(e.message || 'Không thể lưu', 'error'); }
}

async function removeLeaf(imageId) {
  if (!confirm('Xoá chiếc lá này khỏi cây?')) return;
  try {
    await API.myImages.remove(imageId);
    Toast.show('Đã xoá lá', 'success');
    closeLeafModal();
    await loadLeaves();
  } catch (e) { Toast.show(e.message || 'Không thể xoá', 'error'); }
}

Auth.onReady(onAuthChange);
</script>
</body>
</html>
