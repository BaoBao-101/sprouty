# nginx on the VPS is an API gateway, not a web server.
#
# The SPA is deployed to Vercel, which rewrites /api/* and /uploads/* back to
# this host (see vercel.json). So there is nothing to serve from disk here: no
# SPA root, no try_files, no index.html. The only certificate this machine holds
# is for api.sprouty.id.vn, which is the name Vercel calls.
#
# The repo's copy of this file is the one for running the whole stack locally,
# where nginx DOES serve the built SPA and the certificate is for the apex
# domain. Do not copy that version here — nginx will refuse to start on a
# certificate this host does not have.

server {
    listen 80;
    listen [::]:80;
    server_name api.sprouty.id.vn;

    # Let's Encrypt renewal has to stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.sprouty.id.vn;

    ssl_certificate     /etc/letsencrypt/live/api.sprouty.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sprouty.id.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Uploads can be large; the API itself accepts up to 25 MB bodies.
    client_max_body_size 30m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Uploaded assets are served by the API, which checks who may read them.
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nothing else lives on this host.
    location / {
        return 404;
    }
}
