server {
    listen 80 default_server;

    # Block hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    root /usr/share/nginx/html;
    index index.html;

    # Restrict admin and employee pages — redirect to home if session cookie is absent.
    # Cookie name must match SESSION_COOKIE in backend/src/plugins/session.js ('session_id').
    location ~ ^/pages/(admin|employee)/ {
        if ($cookie_session_id = "") { return 302 /; }
        try_files $uri $uri/ =404;
    }

    # Static files
    location / {
        try_files $uri $uri/ =404;
    }

    # Local uploaded assets are served by the backend in local storage mode.
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Proxy API requests to backend — preserve full /api/v1/... path
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_buffering off;

        # Forward cookies correctly
        proxy_pass_header Set-Cookie;
    }
}
