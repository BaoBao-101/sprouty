server {
    listen 80 default_server;

    # Block hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    root /usr/share/nginx/html;
    index index.html;

    # Restrict admin and employee areas — redirect to home if the session cookie
    # is absent. Cookie name must match SESSION_COOKIE in
    # backend/src/plugins/session.js ('session_id'). This only hides the page
    # shell; every endpoint behind it is authorised again on the server.
    location ^~ /admin {
        if ($cookie_session_id = "") { return 302 /; }
        try_files $uri /index.html;
    }
    location ^~ /employee {
        if ($cookie_session_id = "") { return 302 /; }
        try_files $uri /index.html;
    }

    # Local uploaded assets are served by the backend in local storage mode.
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Proxy API requests to backend — preserve full /api/v1/... path
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_buffering off;

        # Forward cookies correctly
        proxy_pass_header Set-Cookie;
    }

    # Single-page app: every other path renders index.html and React Router
    # decides what to show. Real files (hashed bundles, images) still win.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
